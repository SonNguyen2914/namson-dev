name: CI

# V8.1 evaluation — the frontend build/typecheck/lint was never
# independently reproduced. This makes it automatic and blocking, with
# the lockfile enforced (npm ci) so a fresh runner resolves the exact
# dependency stack.

on:
  push:
    branches: [main]
  pull_request:

# A SUPERSEDED RUN IS SPENT, NOT SAVED — and only pull requests cancel.
#
# MEASURED 2026-09-14, the day the account's Actions minutes ran out:
# 123 runs on this repo in September for ~849 minutes, beside ~1,988 on
# the backend. Every force-push to a branch started a second run while
# the first went on to completion against a revision nobody would merge.
#
# PUSHES TO MAIN ARE NEVER CANCELLED. A cancelled run is not a green
# one, and Vercel and the deploy gates read the result rather than the
# intent — cancelling the run that gates a deploy does not save it, it
# skips it. So the cancellation is conditioned on the event: a branch
# may lose its stale run, main never loses the one that gates its
# deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    # A CEILING ON A RUN THAT HANGS. GitHub's default is 360 minutes, so
    # one wedged step — a Playwright server that never binds, a browser
    # that never exits — can spend six hours of the month's allowance on
    # a single job while reporting nothing. The observed average here is
    # ~7 minutes and the slowest legitimate run measured is ~10.5; 30 is
    # wide enough that a slow runner is not failed for being slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # npm install, not npm ci: Tailwind v4 pulls platform-specific
      # native binaries (@tailwindcss/oxide, lightningcss) whose
      # transitive optional deps (@emnapi/*) can't all be captured in a
      # single lockfile generated on one OS — a known npm limitation.
      # install still pins versions from the committed lockfile and
      # resolves the Linux-only optional deps the runner needs.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E — decision-safety (against the live shadow backend)
        run: npm run test:e2e
